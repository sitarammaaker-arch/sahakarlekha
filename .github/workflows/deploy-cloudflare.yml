name: Deploy to Cloudflare

# sahakarlekha.com on Cloudflare Workers (2026-11-21, after the Vercel team pause). Builds dist/ exactly like the
# Vercel build, adds dist/_headers + the routing Worker (wrangler.jsonc, cloudflare/worker.js), and deploys.
#
#   · every push to main            → deploy (what Vercel did on merge)
#   · daily 00:05 / 09:00 IST       → deploy ONLY when a blog post is due today/yesterday (the GOS-05 guard the old
#                                     Vercel scheduled-rebuild.yml had — retired 2026-11-21), so a scheduled post's static page goes live on time
#   · Actions tab → Run workflow    → deploy
#
# One-time setup (the account owner, never in code):
#   GitHub repo → Settings → Secrets and variables → Actions → New repository secret:
#     CLOUDFLARE_API_TOKEN   — Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" template
#     CLOUDFLARE_ACCOUNT_ID  — Cloudflare dashboard → Workers & Pages → Account ID (right side)
#     VITE_SUPABASE_URL      — the same value as in Vercel → Project → Settings → Environment Variables
#     VITE_SUPABASE_ANON_KEY — the same value as in Vercel (the public anon key, NOT the service_role key)
# Until CLOUDFLARE_API_TOKEN is set this workflow skips cleanly (green) and deploys nothing.

on:
  push:
    branches: [main]
  schedule:
    - cron: '35 18 * * *'  # 00:05 IST
    - cron: '30 3 * * *'   # 09:00 IST
  workflow_dispatch: {}

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Skip note (Cloudflare not set up yet)
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN not set — Cloudflare deploy skipped."

      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''

      - name: Is a scheduled post due? (schedule runs only)
        id: due
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "due=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('src/content/blog/index.ts', 'utf8');
            const dates = [...src.matchAll(/date:\s*'(\d{4}-\d{2}-\d{2})'/g)].map(m => m[1]);
            const day = (ms) => new Date(ms).toISOString().slice(0, 10);
            const IST = 5.5 * 3600 * 1000;
            const today = day(Date.now() + IST), yesterday = day(Date.now() + IST - 86400000);
            const due = dates.some(d => d === today || d === yesterday);
            console.log('today(IST)=' + today + ' due=' + due);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'due=' + due + '\n');
          "

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.due.outputs.due == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Refuse to build without the Supabase values (the app would ship broken)
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.due.outputs.due == 'true'
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY secrets are not set — not deploying a site that cannot log in."
            exit 1
          fi

      - name: Install + build (dist/ + dist/_headers)
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.due.outputs.due == 'true'
        run: npm ci && npm run build:cloudflare

      - name: Deploy (wrangler)
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.due.outputs.due == 'true'
        run: npx wrangler deploy

      - name: Ping IndexNow (scheduled post went live)
        if: env.CLOUDFLARE_API_TOKEN != '' && steps.due.outputs.due == 'true' && github.event_name == 'schedule'
        run: node scripts/indexnow-ping.mjs --live || echo "IndexNow ping failed (non-fatal)."
