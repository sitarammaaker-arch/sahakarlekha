name: CI

# Typecheck + the pure test suite on every PR and every push to main. The audit flagged that the
# ~90 test:* scripts existed but nothing ran them automatically — so a regression only surfaced if
# someone remembered to run them by hand. This makes them a gate. Deploys go through Vercel, not
# here, so a red run is advisory (it tells you a change broke a test) rather than blocking a deploy.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: the test:* scripts import real .ts source and rely on Node's native TypeScript
          # type-stripping (default-on in Node 23.6+/24). On Node 20 every such test fails to load.
          # Match the dev environment (local runs on Node 24).
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        # The ROOT tsconfig.json has "files": [] (it only references the app/node projects), so a bare
        # `tsc --noEmit` checks NOTHING and passed while 12 real type errors sat in the app for months.
        # Point at the app project so this actually gates types. (`npm run typecheck` = the same.)
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Edge-Function bundles match src/
        # scheduled-backup / backup-rehearsal / ai-ask import COMMITTED esbuild bundles
        # (supabase/functions/_shared/*.mjs), not src/. Nothing rebuilt them, so a new registry
        # entity silently never reached the weekly server backup. Rebuild each from source into a
        # temp file and fail if it differs from the committed one. Fix: npm run build:edge-bundles.
        run: npm run check:edge-bundles

      - name: Tests
        # Run every test:* script EXCEPT test:dist, which needs a prior `vite build` (dist/) and
        # belongs in a build job. Collect failures so one broken test doesn't hide the others, then
        # fail the job listing them. (The *-bundle tests build their own esbuild bundle, so they run
        # here. The old filter /dist|bundle/ also silently skipped test:distribution-engine.)
        run: |
          tests=$(node -e "const s=require('./package.json').scripts;console.log(Object.keys(s).filter(k=>k.startsWith('test:')&&k!=='test:dist').join(' '))")
          fails=""
          for t in $tests; do
            echo "::group::npm run $t"
            if npm run "$t"; then :; else fails="$fails $t"; fi
            echo "::endgroup::"
          done
          if [ -n "$fails" ]; then
            echo "::error::Failed test scripts:$fails"
            exit 1
          fi
          echo "All pure test suites passed."

      - name: Payroll staging RLS-coverage (opt-in; runs only if a staging DB secret is set)
        # READ-ONLY assertion that the payroll schema's RLS is complete on a target staging DB.
        # Skips cleanly (green) when PAYROLL_STAGING_DATABASE_URL is unset, so this is opt-in and
        # never blocks a PR by default. CI deliberately does NOT apply/re-run migrations against
        # staging (that would mutate a shared DB) — apply + VERIFICATION.sql are a manual/deploy step.
        env:
          DATABASE_URL: ${{ secrets.PAYROLL_STAGING_DATABASE_URL }}
        run: npm run test:pay-rls-coverage

  # I6 · end-to-end tests against the STAGING Supabase project (never production — playwright.config.ts
  # refuses the prod ref). Opt-in: skips cleanly until the four E2E_* repository secrets are set.
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Skip note (staging secrets not set)
        if: env.E2E_SUPABASE_URL == ''
        run: echo "E2E_* secrets not set — e2e skipped (staging-only; see playwright.config.ts)."
      - uses: actions/checkout@v4
        if: env.E2E_SUPABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.E2E_SUPABASE_URL != ''
        with:
          node-version: '24'
          cache: npm
      - name: Install
        if: env.E2E_SUPABASE_URL != ''
        run: npm ci
      - name: Install Chromium for Playwright
        if: env.E2E_SUPABASE_URL != ''
        run: npx playwright install --with-deps chromium
      - name: E2E (staging)
        if: env.E2E_SUPABASE_URL != ''
        run: npm run e2e
      - name: Upload report on failure
        if: failure() && env.E2E_SUPABASE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
