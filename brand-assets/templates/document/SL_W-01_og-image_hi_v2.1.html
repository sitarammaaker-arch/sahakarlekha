<!doctype html>
<!--
  SahakarLekha share image (og:image / twitter:image) v2.1, 1200x630.
  Concept: "बही-खाते से बैलेंस शीट तक" (hand-written register on the left, tallied balance sheet on the right).

  Render to public/og-image.png (run from the repo root, Windows):
    "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --hide-scrollbars ^
      --allow-file-access-from-files --window-size=1200,630 --virtual-time-budget=3000 ^
      --screenshot=public\og-image.png brand-assets\templates\document\SL_W-01_og-image_hi_v2.1.html

  Notes:
  - The register numbers use the Windows font "Ink Free" (falls back to Segoe Print / cursive elsewhere).
  - The register entries on the left are an illustration, not real society data.
  - The Rs 82,049.00 totals match the real balance-sheet screenshot in public/guide-shots/balance-sheet.png.
  - Keep the file under 600 KB (WhatsApp link-preview limit).
  - X draws the page title in a dark label over the bottom-left of every large card (roughly y 545-610,
    x 0-980). Nothing that must be read sits there: the headline and logo are at the top, and only blank
    ruled paper / navy lies under that label.
-->
<html lang="hi"><head><meta charset="utf-8">
<style>
  @font-face { font-family: Hind; font-weight: 500; src: url('../../fonts/Hind-Medium.ttf'); }
  @font-face { font-family: Hind; font-weight: 600; src: url('../../fonts/Hind-SemiBold.ttf'); }
  @font-face { font-family: Hind; font-weight: 700; src: url('../../fonts/Hind-Bold.ttf'); }
  @font-face { font-family: Inter; font-weight: 700; src: url('../../fonts/Inter-Bold.ttf'); }
  :root { --navy: #153f79; --navy-dark: #122d54; --orange: #f48525; --green: #1f9350; --ink: #1d2330; --muted: #676f7e; --line: #d1d8e0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Hind, Inter, sans-serif; position: relative; background: #fff; }

  .old { position: absolute; left: 0; top: 190px; width: 600px; height: 432px; overflow: hidden; background: #f3e6c8;
    background-image: repeating-linear-gradient(to bottom, transparent 0 53px, rgba(60,80,140,.28) 53px 55px); background-position-y: -22px; }
  .old::before, .old::after { content: ''; position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(200,40,40,.55); }
  .old::before { left: 150px; } .old::after { left: 430px; }
  .ink { position: absolute; left: 0; right: 0; font-family: 'Ink Free', 'Segoe Print', 'Segoe Script', cursive; font-weight: 700;
    font-size: 34px; color: #1f3a8a; transform: rotate(-1.5deg); white-space: nowrap; }
  .ink b { position: absolute; font-weight: 700; }
  .ink .hi { font-family: Hind; font-weight: 500; transform: skewX(-12deg); display: inline-block; }
  .cut { text-decoration: line-through; text-decoration-color: #c62828; text-decoration-thickness: 3px; }
  .red { color: #c62828; }
  .ring { position: absolute; left: 440px; top: 264px; width: 150px; height: 74px; border: 4px solid #c62828; border-radius: 50%; transform: rotate(-6deg); }

  .new { position: absolute; left: 600px; top: 190px; width: 600px; height: 432px; background: var(--navy); overflow: hidden; }
  .blob { position: absolute; width: 420px; height: 420px; right: -150px; top: -170px; border-radius: 50%; background: var(--navy-dark); }
  .sheet { position: absolute; left: 96px; top: 78px; width: 440px; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 14px 40px rgba(0,0,0,.35); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 16px 26px 12px; font-size: 27px; line-height: 1.5; font-weight: 500; color: var(--ink); border-bottom: 1px solid var(--line); }
  .row b { font-family: Inter; font-weight: 700; color: var(--navy); }
  .ok { background: #e8f5ee; color: var(--green); font-weight: 700; font-size: 30px; line-height: 1.5; padding: 16px 26px 12px; text-align: center; }

  .tag { position: absolute; top: 22px; font-weight: 600; font-size: 22px; line-height: 1.5; padding: 4px 16px 2px; border-radius: 8px; color: #fff; }
  .old .tag { left: 28px; background: #5b4a2a; z-index: 2; }
  .new .tag { left: 96px; background: var(--orange); }
  .go { position: absolute; left: 556px; top: 334px; width: 88px; height: 88px; border-radius: 50%; background: var(--orange); border: 6px solid #fff;
    color: #fff; font-family: Inter; font-weight: 700; font-size: 44px; display: flex; align-items: center; justify-content: center; }

  .foot { position: absolute; left: 64px; right: 64px; top: 0; height: 190px; display: flex; align-items: center; justify-content: space-between; }
  h1 { font-weight: 700; font-size: 64px; line-height: 1.22; color: var(--navy); padding-top: 10px; }
  h1 span { color: var(--orange); }
  .foot img { height: 50px; display: block; margin-left: auto; }
  .url { font-family: Inter; font-weight: 700; font-size: 22px; color: var(--muted); margin-top: 10px; text-align: right; }
  .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; border-top: 1px solid var(--line);
    background: linear-gradient(to right, var(--orange) 0 33.33%, #fff 33.33% 66.66%, var(--green) 66.66% 100%); }
</style></head><body>
  <div class="old">
    <div class="tag">पहले</div>
    <div class="ink" style="top:94px"><b style="left:24px">12/4</b><b style="left:172px"><span class="hi">नकद बिक्री</span></b><b style="left:452px">4,500</b></div>
    <div class="ink" style="top:149px"><b style="left:24px">13/4</b><b style="left:172px"><span class="hi">खाद खरीद</span></b><b style="left:452px" class="cut">12,300</b></div>
    <div class="ink" style="top:204px"><b style="left:24px">15/4</b><b style="left:172px"><span class="hi">सदस्य जमा</span></b><b style="left:452px">7,25<span class="red">?</span></b></div>
    <div class="ink" style="top:274px"><b style="left:172px"><span class="hi">कुल जोड़</span></b><b style="left:452px" class="red">81,949</b></div>
    <div class="ring"></div>
  </div>
  <div class="new">
    <div class="blob"></div>
    <div class="tag">अब</div>
    <div class="sheet">
      <div class="row"><span>कुल देनदारी</span><b>₹82,049.00</b></div>
      <div class="row"><span>कुल संपत्ति</span><b>₹82,049.00</b></div>
      <div class="ok">✓ बैलेंस शीट मिल गई</div>
    </div>
  </div>
  <div class="go">→</div>
  <div class="foot">
    <h1>बही-खाते से <span>बैलेंस शीट</span> तक।</h1>
    <div><img src="../../logo/SL_B-02_logo-horizontal-clean_v1.0.svg" alt=""><div class="url">sahakarlekha.com</div></div>
  </div>
  <div class="strip"></div>
</body></html>
